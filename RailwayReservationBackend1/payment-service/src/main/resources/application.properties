# ============================================================
# PAYMENT SERVICE CONFIGURATION (SPRING BOOT)
# ============================================================

# 1. Application Identification
spring.application.name=payment-service

# 2. Server Port (Matches API Gateway route PAYMENT_SERVICE_URL=http://localhost:8085)
server.port=8085

# ============================================================
# IN-MEMORY DATABASE CONFIGURATION (H2)
# ============================================================
# H2 database is used for fast, zero-setup beginner execution.
# Data is auto-seeded when the application starts.

spring.datasource.url=jdbc:h2:mem:railway_payment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# EUREKA SERVICE DISCOVERY CLIENT
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Swagger UI / OpenAPI Specs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.railway.payment.controller

