# ============================================================
# NOTIFICATION SERVICE CONFIGURATION (SPRING BOOT)
# ============================================================

# 1. Application Identification
spring.application.name=notification-service

# 2. Server Port (Port 8086 - matches API Gateway NOTIFICATION_SERVICE_URL=http://localhost:8086)
server.port=8086

# ============================================================
# IN-MEMORY DATABASE CONFIGURATION (H2)
# ============================================================
# H2 database is used for fast, zero-setup execution.
# Notification data is stored in memory and seeded at startup.

spring.datasource.url=jdbc:h2:mem:railway_notification_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8086/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# EUREKA SERVICE DISCOVERY CLIENT
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Swagger UI / OpenAPI Documentation Specs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.railway.notification.controller
