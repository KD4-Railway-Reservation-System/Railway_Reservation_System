# ============================================================
# APPLICATION CONFIGURATION
# ============================================================

# Application name - used for service discovery and identification
spring.application.name=auth-service

# Server port
server.port=8081

# ============================================================
# JWT (JSON Web Token) SECURITY CONFIGURATION
# ============================================================

# JWT Secret Key - used to sign and verify JWT tokens
# IMPORTANT: Must be at least 256 bits (32 characters) for HS256 algorithm
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# JWT Expiration time (24 hours = 86400000 milliseconds)
jwt.expiration=86400000

# ============================================================
# DATABASE CONFIGURATION
# ============================================================

# Database connection URL
# Added allowPublicKeyRetrieval=true to fix connection error
spring.datasource.url=jdbc:mysql://localhost:3306/railway_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database credentials
spring.datasource.username=root
spring.datasource.password=Rahul21@

# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA (Java Persistence API) CONFIGURATION
# ============================================================

# Hibernate DDL auto mode - update schema automatically
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for debugging
spring.jpa.show-sql=true

# FIXED: Updated deprecated MySQL8Dialect to MySQLDialect for Spring Boot 3 / Hibernate 6 compatibility
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# EUREKA SERVICE DISCOVERY CONFIGURATION
# ============================================================

# Eureka server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Instance identification
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ============================================================
# LOGGING CONFIGURATION
# ============================================================

# Application logging level
logging.level.com.railway.auth=DEBUG

# Spring Security logging
logging.level.org.springframework.security=DEBUG

# ============================================================
# SWAGGER (OpenAPI) CONFIGURATION
# ============================================================

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# API docs path
springdoc.api-docs.path=/api-docs

# Packages to scan for API documentation
springdoc.packages-to-scan=com.railway.auth.controller

# Paths to include in documentation
springdoc.paths-to-match=/**

