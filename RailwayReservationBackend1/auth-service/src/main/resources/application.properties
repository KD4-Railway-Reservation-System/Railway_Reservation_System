# ============================================================
# PRODUCTION CONSIDERATIONS (Uncomment for production)
# ============================================================

# 1. Use environment variables for sensitive values:
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# jwt.secret=${JWT_SECRET}

# 2. Disable show-sql in production:
# spring.jpa.show-sql=false

# 3. Use validate mode for DDL in production:
# spring.jpa.hibernate.ddl-auto=validate

# 4. Enable HTTPS in production:
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${KEYSTORE_PASSWORD}

# 5. Use proper logging levels in production:
# logging.level.com.railway.auth=INFO
# logging.level.org.springframework.security=WARN

# 6. Configure proper Eureka server URL:
# eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}